name: CI

# Runs on every PR into main, and again on main after a merge.
#
# No `paths:` filter, on purpose. Branch protection requires the `proposal-ci`
# check, and a workflow skipped by a path filter never reports a status at all --
# the PR would sit at "Expected - Waiting for status to be reported" forever.
# Cheap to always run; miserable to debug.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # The job key AND the job name are both `proposal-ci`, and that exact string
  # is the required status check in ci/setup_branch_protection.sh. Change one
  # and you must change the other, or every PR in this repo blocks forever.
  # ==========================================================================
  proposal-ci:
    name: proposal-ci
    runs-on: ubuntu-latest
    # 25, not 20: the responsive audit at the end of this job adds an npm
    # install, a Chromium download on a cold cache, an app boot and ~30s of
    # browser work. Free minutes on a public repo, but not free wall clock.
    timeout-minutes: 25

    # Production is Postgres; every other check here runs on SQLite. That gap
    # used to be harmless, but the migration runner now has a real Postgres-only
    # branch -- the information_schema snapshot, SET LOCAL lock_timeout, SQLSTATE
    # 55P03 retry handling and pg_index verification -- and a failed migration
    # now ABORTS the release. Untested code that can stop a deploy is not
    # something to find out about during a deploy, so ci/check_migrations.py
    # runs against both backends.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # app.py constructs an OpenAI client at IMPORT time and raises if this is
      # unset -- so it has to be present for the app to import at all. It is a
      # DUMMY. Nothing in CI calls OpenAI. Never put a real key here; CI logs
      # and forks would both see it.
      OPENAI_API_KEY: ci-dummy-openai-credential
      SECRET_KEY: ci-smoke-test-key
      APP_BASE_URL: http://localhost:5000

    steps:
      # fetch-depth: 0 because ci/check_migrations.py replays this branch's
      # release phase against the schema the BASE commit builds, and a depth-1
      # clone does not contain that commit. The replay skips loudly rather than
      # passing quietly if it is missing, so a shallow checkout would not break
      # the build -- it would just remove the one check that catches a model
      # column with no migration, which is the reason it exists.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Must match runtime.txt (python-3.11.7). ci/check_deploy_config.py
          # fails the build if these two ever drift apart.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Heroku deploy config
        run: python ci/check_deploy_config.py

      # A STEP inside proposal-ci, not a job: `proposal-ci` is the required status
      # check, and a new job would be a new context that gates nothing.
      #
      # This is the only place the lock is verified on the platform it was built
      # for. It asserts three things a reader might assume are automatic and are
      # not: that requirements.txt actually carries `-c requirements.lock` (without
      # it the lock is a text file nobody reads), that no direct pin contradicts the
      # lock, and -- the one that matters -- that NOTHING resolves without a pin.
      # A constraints file does not have to be complete: a package missing from it
      # installs unconstrained and pip says nothing at all, which is precisely the
      # silent gap the lock exists to close.
      - name: Every installed version is pinned
        run: python ci/check_requirements_lock.py --label proposal-evaluation

      # A STEP inside proposal-ci, deliberately not a job of its own: `proposal-ci`
      # is the required status check (see the comment above), and a new job would
      # be a new status context that gates nothing. Placed before smoke_app.py so
      # it fails in seconds rather than after a full app boot.
      #
      # analytics_channel_rules.py is shared with writeitgreat-llc/website, which
      # this job cannot see -- so this cannot tell you the OTHER repo changed. It
      # tells you THIS repo's rules moved, which is the moment to port them.
      - name: Channel classifier matches the shared rules
        run: python ci/check_channel_parity.py

      # A STEP inside proposal-ci, deliberately not a job of its own -- same
      # reason as the two steps around it. Placed before smoke_app.py because it
      # is pure AST work and finishes in under a second.
      #
      # This is the check that stops an OpenAI call shipping without a time
      # budget. One process, four threads: a call on the SDK's 600s x 3 default
      # is not a slow feature, it is a quarter of the site gone for half an hour.
      # It exists in particular to catch the `openai.chat.completions.create`
      # module-level form, which reads identically to the budgeted
      # `client.chat.completions.create` and silently bypasses it.
      - name: Every OpenAI call has a time budget
        run: python ci/check_ai_timeouts.py

      # A STEP inside proposal-ci, deliberately not a job of its own -- same
      # reason as the steps around it, and it matters more here than usual: a
      # new job would need a new required-check name, which lives in THREE
      # places that drift apart silently (the live branch-protection policy,
      # ci/setup_branch_protection.sh, and deploy.yml's BLOCKING_CHECKS). Adding
      # a step to a job that is already required costs nothing and gates
      # everything.
      #
      # It lives in this job rather than in security.yml because it is the only
      # one that has already run `pip install -r requirements.txt`; the security
      # jobs are deliberately static and install nothing but their own scanner.
      #
      # What it proves: that observability.py still stops Sentry shipping
      # personal data. Every leak it checks for is an SDK DEFAULT -- request
      # bodies up to 10,000 bytes, locals in every frame, no truncation, and a
      # URL captured whatever else is off -- so a future edit that "simplifies"
      # that file back toward the five-line documented install reintroduces all
      # of them at once, and nothing else in CI would notice. It initialises
      # against a dead local DSN and sends nothing anywhere.
      - name: Sentry cannot ship personal data
        run: python ci/check_sentry_scrub.py

      # A STEP inside proposal-ci, deliberately not a job of its own -- same
      # reason as the steps around it. Pure text scanning, finishes instantly.
      #
      # The companion to the responsive audit further down, and it exists for
      # what that audit CANNOT see: the audit measures pages it can reach, and
      # it cannot reach /admin, because team login is 2FA-mandatory and driving
      # TOTP in CI is a flake source we chose not to take on. `.bulk-bar` on the
      # admin dashboard sat at `top: 60px` for months -- behind the header at
      # every width -- and no runtime check in this repo would ever have looked
      # at it. This one reads the rule instead of the rendering, so it covers
      # every page including the ones nothing can log into.
      - name: No sticky element hard-codes the header height
        run: python ci/check_sticky_offsets.py

      - name: Import app, compile templates, run migrations, render public pages
        run: python ci/smoke_app.py

      # A STEP inside proposal-ci, not a job of its own, for the reason given
      # further down: a new job is a new status context that gates nothing
      # until ci/setup_branch_protection.sh is re-run. Unlike every other check
      # here it SEEDS the database before asserting -- the fault it pins (a
      # months-old backlog costing the reviewer two emails per row on the first
      # successful run) exists only in pre-existing rows, so against the empty
      # database the others build, the job under test is a no-op that passes
      # whatever it does.
      - name: One-pager reminders do not bombard a reviewer
        run: python ci/check_one_pager_reminders.py

      # A STEP inside proposal-ci, deliberately not a job of its own -- same
      # required-check-name coupling as every other step here.
      #
      # The author and publisher login forms accepted unlimited password
      # guesses, and the staff lockout that did exist never reset its counter
      # after a lock expired AND cleared it the moment a password matched --
      # BEFORE the TOTP step, which handed anyone holding the password
      # unlimited code guesses five at a time. This drives all three login
      # routes end to end and pins the shared semantics: the capped 15/30/60
      # ladder, the fresh five after an expired lock, the 12-quiet-hour decay,
      # the burst guard on an already-locked account, the per-caller throttle,
      # and -- the one that matters most on SQLite -- that every lockout
      # timestamp is WRITTEN naive UTC, because an aware value expires a lock
      # instantly on a non-UTC Postgres session while passing every test here.
      - name: Sign-in lockout holds on all three account types
        run: python ci/check_author_lockout.py

      # Blocking, on purpose. This one asserts the privacy promises the consent
      # banner makes to visitors -- that no raw IP and no raw User-Agent is ever
      # written to storage, that the query string and any URL token are stripped
      # from a stored path, that the visitor hash rotates daily, that GPC is
      # honoured, that the analytics cookie is HttpOnly -- and it asserts the
      # scope boundary: the public funnel pages are instrumented and the
      # signed-in interior is not. A promise nothing checks is a promise that
      # quietly stops being true.
      - name: Analytics collector, consent, and privacy invariants
        run: python ci/check_analytics.py

      # A STEP inside proposal-ci, deliberately not a job of its own -- same
      # required-check-name coupling as the migrations step below.
      #
      # proposal-evaluation-20d7e1515843.herokuapp.com serves this app outside
      # Cloudflare, so CF-Connecting-IP was forgeable there and every control
      # keyed on it -- the post-bot sign-up limits, the /social-strategy
      # lead-magnet limits, /api/submit's limiter, visitor_hash -- could be
      # sidestepped by typing a different address per request. This asserts the
      # header is believed only when the appended X-Forwarded-For hop is a real
      # Cloudflare edge, that ordinary visits 301 to authors.writeitgreat.com,
      # and -- the part that protects the deploy -- that the machine paths are
      # still exempt: the Wix caller polls /api/status, the origin-only uptime
      # probe watches /healthz, and deploy.yml's smoke target is one of them.
      - name: The herokuapp origin cannot forge a visitor, and machine callers still reach it
        run: python ci/check_edge_trust.py

      # A STEP inside proposal-ci, deliberately not a job of its own: proposal-ci
      # is the required status check, and a new job would be a new status context
      # that gates nothing until someone re-runs ci/setup_branch_protection.sh
      # AND adds the name to deploy.yml's BLOCKING_CHECKS.
      #
      # This is the check that stops the migration runner from quietly going back
      # to swallowing failures. It poisons a schema and asserts migrate.py exits
      # NON-ZERO, asserts a second run of a migrated database issues zero DDL, and
      # asserts a ledger row claiming a column the database does not have gets
      # deleted rather than believed. Runs against SQLite and against the Postgres
      # service above, because production only ever runs the second one.
      #
      # It also runs the UPGRADE REPLAY: build the schema from the base commit's
      # models -- which is what production has -- and run this branch's migrate.py
      # against it, exactly as Heroku will. That is the only check in this repo
      # that ever meets a database it did not build from the models under test,
      # and so the only one that can notice a db.Column added with no matching
      # `_add()`. Every other check here, including smoke_app.py, starts from an
      # empty database where create_all() makes every column from the model and
      # nothing can be missing by construction.
      #
      # SCHEMA_REPLAY_BASE is the commit to replay FROM: the PR's base on a
      # pull_request run, the previous main on a push. It needs `fetch-depth: 0`
      # on the checkout above -- without it the sha is not in the clone, and the
      # replay says so loudly and skips rather than passing quietly.
      - name: Migrations fail loudly, apply once, verify their own ledger, and survive an upgrade
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
          SCHEMA_REPLAY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python ci/check_migrations.py

      # Another STEP inside proposal-ci for the same reason as the one above: a
      # new job is a new status context that gates nothing until three files
      # agree about its name.
      #
      # /healthz used to run `SELECT 1`, which a completely empty database
      # answers happily -- so on 2026-08-04 it reported {"ok":true} while every
      # sign-in was failing. It now reads a real table and 503s on a dyno when
      # the backend is not Postgres or the schema is unreadable.
      #
      # Half of what this asserts is that the probe does NOT fire: on a
      # correct-but-empty database (which is what smoke_app.py builds and what
      # every laptop has before migrations run), and -- the subtle one -- while
      # a migration holds the table. The schema probe takes a lock that
      # `SELECT 1` never did, and every release migrates while the OLD dynos are
      # still serving, so without a lock_timeout and SQLSTATE classification
      # this endpoint reports a healthy site as down during its own deploy.
      # That scenario needs the Postgres service; SQLite has neither locks of
      # that kind nor SQLSTATEs, so it cannot stand in.
      - name: The health check can tell a real database from an empty one
        env:
          HEALTHZ_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
        run: python ci/check_healthz.py

      # A STEP inside proposal-ci, same reason as every other step here.
      #
      # Two foreign keys to `author` were declared on the models and missing from
      # production until they were added, so the database now enforces something
      # it did not before -- and an admin delete that used to leave rows behind
      # would 500 instead. Six tables point at `author`, three of those have
      # children, there is not one `cascade=` in app.py, so the delete order is
      # hand-written and only a test keeps it honest.
      #
      # MUST have the Postgres URL: SQLite does not enforce foreign keys unless
      # PRAGMA foreign_keys is on, so the SQLite leg alone cannot fail for the
      # reason this check exists. It says so loudly when the variable is unset.
      - name: Deleting an author is not blocked by the keys that protect them
        env:
          AUTHOR_DELETE_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
        run: python ci/check_author_delete.py

      # The same fault one level down, and it was live: `proposal` has two NOT
      # NULL children (proposal_note, publisher_proposal) and both delete paths
      # were a bare db.session.delete(), so the admin Delete button 500'd for any
      # proposal with a note, a share -- or an archive toggle, which writes a note
      # itself. "Archive the junk now, purge it later" was the exact workflow that
      # made the purge impossible. Reproduced against real PostgreSQL before the
      # fix: NotNullViolation on proposal_note.proposal_id.
      #
      # It is also the storage recovery path: uploaded files live in the database,
      # so deleting proposals is the only way to reclaim that space by hand.
      #
      # Same Postgres requirement, same reason as the check above it.
      - name: Deleting a proposal works on one somebody has actually touched
        env:
          PROPOSAL_DELETE_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
        run: python ci/check_proposal_delete.py

      # ======================================================================
      # RESPONSIVE / MOBILE AUDIT
      #
      # Steps inside proposal-ci, deliberately not a job of their own -- same
      # reason as every other step here: proposal-ci is the required status
      # check, and a new job would be a new status context that gates nothing
      # until someone re-runs ci/setup_branch_protection.sh AND adds the name
      # to deploy.yml's BLOCKING_CHECKS.
      #
      # This is the check that would have caught the 4 Aug 2026 mobile header:
      # a nav that ran off the right edge of the phone, taking the paid CTA with
      # it, and a header three rows tall that covered the "your account has been
      # created" banner. Nothing in CI saw it, because nothing in CI had a
      # viewport OR a logged-in session -- smoke_app.py drives test_client over
      # public routes, and base.html renders the nav only for a signed-in user.
      # ci/responsive/README.md has the full account. The audit REGISTERS an
      # author through the real form for exactly that reason; a version of it
      # limited to public pages is a false green.
      #
      # Actions minutes are free on this repo (it is public), so the ~2 minutes
      # this adds costs nothing but wall clock.
      # ======================================================================
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('ci/responsive/package.json') }}

      - name: Install audit dependencies
        working-directory: ci/responsive
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start the app for the audit
        env:
          # Four slashes = absolute path. Flask-SQLAlchemy 3.x resolves a
          # relative sqlite:/// path against app.instance_path, which would put
          # the release step and the serving process on different databases if
          # the working directory ever differed.
          DATABASE_URL: sqlite:////tmp/wig_responsive.db
          # No Turnstile keys, so turnstile_enabled() is false and the audit's
          # registration goes through without a challenge (app.py:7424). Do not
          # add real keys here -- this repo is public and its logs are too.
          APP_BASE_URL: http://127.0.0.1:5000
        run: |
          rm -f /tmp/wig_responsive.db
          # The literal Heroku release phase, so the schema the audit runs
          # against is built the way production's is.
          python migrate.py
          # Same entrypoint as the Procfile.
          gunicorn app:app --bind 127.0.0.1:5000 --workers 1 --threads 4 \
            --access-logfile - --error-logfile - > /tmp/audit-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5000/author/login > /dev/null 2>&1; then
              echo "app is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::app did not come up within 40s"
          cat /tmp/audit-server.log
          exit 1

      - name: Responsive audit (phone, tablet and desktop, signed in and out)
        run: node ci/responsive/audit.js --base-url http://127.0.0.1:5000

      - name: Upload audit report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-report
          path: |
            ci/responsive/_report
            /tmp/audit-server.log
          retention-days: 14
          if-no-files-found: warn

      # Non-blocking. app.py does `import requests as http_requests` but
      # requests is NOT in requirements.txt -- today it only installs because
      # xhtml2pdf -> pyHanko happens to depend on it. That is luck, not a
      # contract. This surfaces the problem as a PR annotation without blocking
      # a 3-person team from shipping.
      - name: Undeclared dependency check (warning only)
        continue-on-error: true
        run: python ci/check_undeclared_imports.py
