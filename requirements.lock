# requirements.lock -- proposal-evaluation (authors.writeitgreat.com)
#
# EVERY package this app installs, at the exact version, including the transitive
# ones nobody chose. requirements.txt carries `-c requirements.lock` on its first
# line, so pip -- including the pip Heroku's buildpack runs -- constrains the build
# to these versions. That is what makes a rebuild reproducible, and what lets anyone
# answer "what is actually running?" by reading a file instead of a dyno.
#
# GENERATED ON THE DYNO, NOT A LAPTOP. Resolution is platform-dependent and for this
# stack it genuinely differs: SQLAlchemy declares
#     greenlet>=1 ; platform_machine == "aarch64" or ... "x86_64" ...
# so greenlet is part of the build on Heroku (linux/x86_64) and absent on an
# Apple-silicon laptop (arm64). Resolving this same file on a Mac produced 60
# packages; the dyno produced 61. The difference was greenlet -- the concurrency
# substrate underneath SQLAlchemy, which would have been left floating by a lock
# built in the wrong place.
#
#   platform : linux x86_64 (heroku-24)
#   python   : 3.11.7
#   packages : 61
#   generated: 2026-08-05
#
# DO NOT HAND-EDIT. Regenerate, on a dyno:
#     cat ci/resolve_requirements.py | heroku run --no-tty -a proposal-evaluation \
#         "cat > /tmp/res.py && python /tmp/res.py"
# ci/check_requirements_lock.py fails the build if anything installs without a pin
# here -- a constraints file does not require completeness, so a missing package
# floats free and pip says nothing.
